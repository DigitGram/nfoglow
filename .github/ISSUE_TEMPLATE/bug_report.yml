name: Bug report
description: Something in NfoGlow does not work as expected
labels:
- bug
body:
- type: markdown
  attributes:
    value: Thanks for reporting! The more of this you fill in, the faster NfoGlow gets fixed. Please search the existing
      issues first.
- type: textarea
  id: what
  attributes:
    label: What happened?
    description: A short description of the problem. What did you expect instead?
  validations:
    required: true
- type: textarea
  id: steps
  attributes:
    label: Steps to reproduce
    placeholder: '1. Open ...

      2. Switch on ...

      3. ...'
  validations:
    required: true
- type: dropdown
  id: area
  attributes:
    label: Where does it happen?
    options:
    - Showing an NFO (characters, encoding, ANSI colours)
    - Glow, colours or the other effects
    - Opening effects
    - Music
    - Search, links, copying
    - ZIP or SRR files
    - Save as PNG or PDF
    - Settings
    - Installation
    - Other
  validations:
    required: true
- type: input
  id: version
  attributes:
    label: NfoGlow version
    description: Output of `nfoglow --version`
    placeholder: NfoGlow 1.0
  validations:
    required: true
- type: dropdown
  id: install
  attributes:
    label: How did you install it?
    options:
    - One-line installer (curl/wget)
    - git clone + ./install.sh
    - Flatpak
    - Other
- type: input
  id: os
  attributes:
    label: Distribution and version
    description: For example Ubuntu 24.04 or Fedora 40. `cat /etc/os-release` shows it.
    placeholder: Ubuntu 24.04
  validations:
    required: true
- type: input
  id: desktop
  attributes:
    label: Desktop and session (optional)
    description: For example GNOME 46 on Wayland, or on X11, and the display scaling if it is not 100 %.
    placeholder: GNOME 46, Wayland, 125 %
- type: input
  id: gpu
  attributes:
    label: Graphics card and driver (optional, for drawing problems)
    description: The window is drawn by the graphics card, so this helps with glitches and slowness.
    placeholder: AMD Radeon, Mesa 24.0
- type: input
  id: libs
  attributes:
    label: GTK, libadwaita and Python versions (optional)
    description: '`python3 -c "import gi; gi.require_version(''Adw'',''1''); from gi.repository import Adw; print(''libadwaita'',
      Adw.get_major_version(), Adw.get_minor_version(), Adw.get_micro_version())"` and `python3 --version`'
    placeholder: libadwaita 1.5.0, Python 3.12
- type: textarea
  id: log
  attributes:
    label: Terminal output (optional)
    description: Start `nfoglow` from a terminal, repeat the problem and paste anything it prints.
    render: shell
- type: textarea
  id: shots
  attributes:
    label: Screenshots or the file (optional)
    description: Drag and drop images here. An `.nfo` that shows the problem can be attached zipped.
- type: checkboxes
  id: dupes
  attributes:
    label: Before sending
    options:
    - label: I searched the existing issues and found none for this problem
      required: true
