name: tests
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-24.04  # GTK 4.14, the oldest supported: ubuntu-latest moves to 26.04 in late 2026
    steps:
      - uses: actions/checkout@v4
      # system Python: it has the GTK, cairo and GStreamer bindings (python.org builds do not)
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-gi python3-gi-cairo gir1.2-adw-1 gir1.2-gstreamer-1.0 gstreamer1.0-plugins-base gstreamer1.0-plugins-good ffmpeg fonts-dejavu-core python3-pyflakes xvfb dbus-x11
      - run: /usr/bin/python3 -m pyflakes src tests tools
      - run: /usr/bin/python3 tests/test_core.py
      - run: shellcheck install.sh tests/install_test.sh
      - run: xvfb-run -a dbus-run-session -- /usr/bin/python3 tests/smoke_gtk.py
      - run: tests/install_test.sh  # here, not in the container below: install.sh refuses root
      - run: scripts/build-deb.sh "$RUNNER_TEMP" && dpkg-deb -I "$RUNNER_TEMP"/nfoglow_*_all.deb && shellcheck scripts/build-deb.sh

  ubuntu-26-04:  # the newest GNOME we support: newer GTK lays out and newer Python behaves differently from the job above
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    env:
      DEBIAN_FRONTEND: noninteractive  # tzdata would otherwise ask for a time zone and hang
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y --no-install-recommends python3 python3-gi python3-gi-cairo gir1.2-adw-1 gir1.2-gstreamer-1.0 gstreamer1.0-plugins-base gstreamer1.0-plugins-good ffmpeg fonts-dejavu-core xvfb xauth dbus dbus-x11
      - run: python3 tests/test_core.py
      - run: xvfb-run -a dbus-run-session -- python3 tests/smoke_gtk.py

  deb:  # the .deb on a clean system: it must install with its dependencies, start, render and leave nothing behind
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:24.04", "ubuntu:26.04", "debian:13"]
    container: ${{ matrix.image }}
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y --no-install-recommends fonts-dejavu-core xvfb xauth shellcheck
      - run: shellcheck scripts/build-deb.sh
      - run: scripts/build-deb.sh "$RUNNER_TEMP"
      - name: install it; apt pulls in the dependencies
        run: apt-get install -y --no-install-recommends "$RUNNER_TEMP"/nfoglow_*_all.deb
      - name: files, version and a rendered NFO
        run: |
          test "$(nfoglow --version)" = "NfoGlow $(sed -n 's/^VERSION="\([^"]*\)".*/\1/p' install.sh)"
          test -x /usr/bin/nfoglow
          test -f /usr/share/applications/io.github.digitgram.NfoGlow.desktop
          test -f /usr/share/icons/hicolor/256x256/apps/io.github.digitgram.NfoGlow.png
          test -d /usr/share/nfoglow/__pycache__   # postinst compiled it
          xvfb-run -a nfoglow --png "$RUNNER_TEMP/demo.png" docs/demo.nfo
          test -s "$RUNNER_TEMP/demo.png"
      - name: remove and purge leave nothing behind
        run: |
          apt-get remove -y nfoglow
          test ! -e /usr/share/nfoglow
          test ! -e /usr/bin/nfoglow
          apt-get purge -y nfoglow
          ! dpkg -s nfoglow 2>/dev/null
