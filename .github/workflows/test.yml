name: tests
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-24.04  # GTK 4.14, the oldest supported: ubuntu-latest moves to 26.04 in late 2026
    steps:
      - uses: actions/checkout@v4
      # system Python: it has the GTK, cairo and GStreamer bindings (python.org builds do not)
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-gi python3-gi-cairo gir1.2-adw-1 gir1.2-gstreamer-1.0 gstreamer1.0-plugins-base gstreamer1.0-plugins-good ffmpeg fonts-dejavu-core python3-pyflakes xvfb dbus-x11
      - run: /usr/bin/python3 -m pyflakes src tests tools
      - run: /usr/bin/python3 tests/test_core.py
      - run: shellcheck install.sh tests/install_test.sh
      - run: xvfb-run -a dbus-run-session -- /usr/bin/python3 tests/smoke_gtk.py
      - run: tests/install_test.sh  # here, not in the container below: install.sh refuses root

  ubuntu-26-04:  # the newest GNOME we support: newer GTK lays out and newer Python behaves differently from the job above
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    env:
      DEBIAN_FRONTEND: noninteractive  # tzdata would otherwise ask for a time zone and hang
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y --no-install-recommends python3 python3-gi python3-gi-cairo gir1.2-adw-1 gir1.2-gstreamer-1.0 gstreamer1.0-plugins-base gstreamer1.0-plugins-good ffmpeg fonts-dejavu-core xvfb xauth dbus dbus-x11
      - run: python3 tests/test_core.py
      - run: xvfb-run -a dbus-run-session -- python3 tests/smoke_gtk.py
